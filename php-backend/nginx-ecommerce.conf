# Place these locations inside the api.skleup.com HTTPS server block.
# The uploads block is more specific and therefore serves media directly.
location ^~ /api/ecommerce/uploads/ {
    alias /var/www/skleup/api/ecommerce/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /api/ecommerce/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/skleup/api/ecommerce/index.php;
    fastcgi_param SCRIPT_NAME /api/ecommerce/index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_read_timeout 60s;
}
